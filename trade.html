<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <title>FORTNITE Sprite Trade Compare</title>
  <meta name="theme-color" content="#0b1020" />

  <link
    rel="stylesheet"
    href="./app.css?v=20260808-v7-sprite-code-a"
  />
  <link
    rel="stylesheet"
    href="./trade.css?v=20260808-trade-b"
  />
</head>

<body>
  <main class="app-shell trade-shell">

    <section
      class="toolbar-card"
      aria-label="Trade comparison controls"
    >
      <div class="toolbar-row">
        <a
          class="pill-button trade-link-button"
          id="tradeBackLink"
          href="./"
        >チェックリストへ戻る</a>

        <div
          class="lang-group"
          aria-label="Language switch"
        >
          <button
            class="pill-button"
            id="tradeJaBtn"
            type="button"
          >日本語</button>

          <button
            class="pill-button"
            id="tradeEnBtn"
            type="button"
          >English</button>
        </div>
      </div>
    </section>

    <section class="trade-card trade-intro-card">
      <h1
        class="trade-page-title"
        id="tradeTitle"
      >精霊交換比較</h1>

      <p
        class="trade-description"
        id="tradeDescription"
      >
        自分と相手の精霊コードを比較し、
        お互いに未所持の精霊を確認します。
      </p>

      <p
        class="trade-notice"
        id="tradeNotice"
      >
        この結果は所持状況の差分です。
        実際に交換できることや交換成立を保証するものではありません。
        Masterも自動的に交換可能とは判定しません。
      </p>
    </section>

    <section class="trade-input-grid">

      <article class="trade-card">
        <h2
          class="trade-section-title"
          id="tradeMyTitle"
        >自分</h2>

        <div class="trade-code-group">
          <label
            class="background-code-label"
            id="tradeMyCodeLabel"
            for="tradeMyCode"
          >精霊コード</label>

          <input
            class="background-code-input trade-code-input"
            id="tradeMyCode"
            type="text"
            maxlength="128"
            placeholder="F1.から始まる自分の精霊コード"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />

          <div class="trade-input-actions">
            <button
              class="background-dialog-button"
              id="tradeUseCurrentBtn"
              type="button"
            >現在のチェック状態を使う</button>
          </div>

          <p
            class="trade-field-message"
            id="tradeMyCodeMessage"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </article>

      <article class="trade-card">
        <h2
          class="trade-section-title"
          id="tradePartnerTitle"
        >相手</h2>

        <div class="trade-code-group">
          <label
            class="background-code-label"
            id="tradePartnerCodeLabel"
            for="tradePartnerCode"
          >精霊コード</label>

          <input
            class="background-code-input trade-code-input"
            id="tradePartnerCode"
            type="text"
            maxlength="128"
            placeholder="F1.から始まる相手の精霊コード"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />

          <p
            class="trade-field-message"
            id="tradePartnerCodeMessage"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </article>

    </section>

    <div class="trade-compare-actions">
      <button
        class="pill-button primary-button"
        id="tradeCompareBtn"
        type="button"
      >比較する</button>

      <button
        class="pill-button"
        id="tradeClearBtn"
        type="button"
      >入力をクリア</button>
    </div>

    <p
      class="trade-global-message"
      id="tradeMessage"
      role="status"
      aria-live="polite"
    ></p>

    <section
      class="trade-results"
      id="tradeResults"
      aria-labelledby="tradeResultsTitle"
      hidden
    >
      <h2
        class="trade-results-title"
        id="tradeResultsTitle"
      >比較結果</h2>

      <div class="trade-result-grid">

        <article class="trade-card trade-result-card">
          <div class="trade-result-heading-row">
            <h3
              class="trade-result-title"
              id="tradePartnerToMeTitle"
            >相手が所持・自分が未所持</h3>

            <span
              class="pill trade-result-summary"
              id="tradePartnerToMeSummary"
            >0件 / Master 0</span>
          </div>

          <p
            class="trade-result-description"
            id="tradePartnerToMeDescription"
          >
            相手が所持していて、自分が未所持の精霊です。
          </p>

          <ul
            class="trade-result-list"
            id="tradePartnerToMeList"
          ></ul>
        </article>

        <article class="trade-card trade-result-card">
          <div class="trade-result-heading-row">
            <h3
              class="trade-result-title"
              id="tradeMeToPartnerTitle"
            >自分が所持・相手が未所持</h3>

            <span
              class="pill trade-result-summary"
              id="tradeMeToPartnerSummary"
            >0件 / Master 0</span>
          </div>

          <p
            class="trade-result-description"
            id="tradeMeToPartnerDescription"
          >
            自分が所持していて、相手が未所持の精霊です。
          </p>

          <ul
            class="trade-result-list"
            id="tradeMeToPartnerList"
          ></ul>
        </article>

      </div>
    </section>

  </main>

  <script src="./sprite-state-codec.js?v=20260811-f1-zero-width-c"></script>
  <script src="./sprite-catalog-f1.js?v=20260809-f1-display-c"></script>
  <script src="./trade.js?v=20260809-trade-d"></script>
</body>
</html>
